name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Crop snake to contribution grid
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          for file in files:
              if not file.exists():
                  print(f"Skip: {file}")
                  continue

              svg = file.read_text(encoding="utf-8")

              # Cari seluruh kotak contribution.
              # Kotaknya biasanya berupa <rect> kecil.
              rects = re.findall(
                  r'<rect[^>]*?x="([\d.]+)"[^>]*?y="([\d.]+)"'
                  r'[^>]*?width="([\d.]+)"[^>]*?height="([\d.]+)"[^>]*?>',
                  svg
              )

              cells = []

              for x, y, w, h in rects:
                  x = float(x)
                  y = float(y)
                  w = float(w)
                  h = float(h)

                  # Contribution cells ukurannya kecil.
                  # Hindari rect besar/background/snake panjang.
                  if 5 <= w <= 20 and 5 <= h <= 20:
                      cells.append((x, y, w, h))

              if not cells:
                  print(f"No contribution cells found: {file}")
                  continue

              # Cari batas terluar grid
              min_x = min(x for x, y, w, h in cells)
              min_y = min(y for x, y, w, h in cells)
              max_x = max(x + w for x, y, w, h in cells)
              max_y = max(y + h for x, y, w, h in cells)

              # Padding sedikit supaya snake tidak kepotong saat berada di grid
              PAD_X = 8
              PAD_TOP = 8
              PAD_BOTTOM = 8

              view_x = max(min_x - PAD_X, 0)
              view_y = max(min_y - PAD_TOP, 0)
              view_w = (max_x - min_x) + (PAD_X * 2)
              view_h = (max_y - min_y) + PAD_TOP + PAD_BOTTOM

              new_viewbox = (
                  f'viewBox="{view_x:g} {view_y:g} '
                  f'{view_w:g} {view_h:g}"'
              )

              # Replace viewBox
              svg, count = re.subn(
                  r'viewBox="[^"]+"',
                  new_viewbox,
                  svg,
                  count=1
              )

              if count == 0:
                  print(f"viewBox not found: {file}")
                  continue

              # Biar tinggi SVG mengikuti aspect ratio baru
              svg = re.sub(
                  r'(<svg\b[^>]*?\bheight=")[^"]+(")',
                  rf'\g<1>{view_h:g}\2',
                  svg,
                  count=1
              )

              svg = re.sub(
                  r'(<svg\b[^>]*?\bwidth=")[^"]+(")',
                  rf'\g<1>{view_w:g}\2',
                  svg,
                  count=1
              )

              file.write_text(svg, encoding="utf-8")

              print(
                  f"Crop success: {file}\n"
                  f"viewBox = {view_x:g} {view_y:g} "
                  f"{view_w:g} {view_h:g}"
              )

          PY

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
